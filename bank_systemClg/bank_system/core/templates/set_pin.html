{% extends 'base.html' %}
{% block content %}

<style>
body {
    background: linear-gradient(135deg, #eef2ff, #f8fafc);
}

.bg-decor {
    position: fixed;
    inset: 0;
    z-index: 0;
}

.bg-decor::before {
    content: "";
    position: absolute;
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(37,99,235,0.15), transparent 70%);
    top: -120px;
    left: -120px;
}

.bg-decor::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(99,102,241,0.12), transparent 70%);
    bottom: -100px;
    right: -100px;
}

.pin-card {
    background: #fff;
    border-radius: 16px;
    padding: 25px;
    border: 1px solid #e5e7eb;
    position: relative;
    z-index: 2;
}

.pin-icon {
    font-size: 30px;
    color: #2563eb;
    margin-bottom: 10px;
}

.pin-input {
    text-align: center;
    letter-spacing: 10px;
    font-size: 22px;
    height: 50px;
}

.error-box {
    background: #fee2e2;
    color: #991b1b;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.success-box {
    background: #dcfce7;
    color: #166534;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.btn-primary {
    background: #2563eb;
    border: none;
}

.btn-primary:hover {
    background: #1d4ed8;
}
</style>

<div class="bg-decor"></div>

<div class="row justify-content-center align-items-center" style="min-height: 85vh;">
<div class="col-md-4">

<div class="pin-card shadow-sm text-center">

<div class="pin-icon">
    <i class="bi bi-shield-lock"></i>
</div>

<h5 class="mb-1">Set Transaction PIN</h5>
<p class="text-muted small mb-3">
    This PIN will be required for transfers
</p>

<!--  DJANGO MESSAGES -->
{% if messages %}
    {% for message in messages %}
        <div class="{% if message.tags == 'success' %}success-box{% else %}error-box{% endif %}">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<!--  DIRECT ERROR (from render) -->
{% if error %}
    <div class="error-box">
        {{ error }}
    </div>
{% endif %}

<form method="post">
{% csrf_token %}

<!--  PASSWORD VERIFICATION -->
<label class="form-label small">Account Password</label>
<input type="password"
       name="password"
       class="form-control mb-3"
       placeholder="Enter your account password"
       required>

<!--  PIN -->
<label class="form-label small">Enter 4-digit PIN</label>
<input type="password"
       name="pin"
       maxlength="4"
       pattern="\d{4}"
       inputmode="numeric"
       class="form-control pin-input mb-2"
       required>


<!--  CONFIRM PIN -->
<label class="form-label small">Confirm PIN</label>
<input type="password"
       name="confirm_pin"
       maxlength="4"
       pattern="\d{4}"
       inputmode="numeric"
       class="form-control pin-input mb-3"
       required>

<button class="btn btn-primary w-100">
    Save PIN
</button>

</form>

</div>
</div>
</div>

{% endblock %}
